<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
 width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Technology stack">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
.bg{fill:#070b16}.card{fill:#0d1628;stroke:#247bff;stroke-opacity:.34}
.white{fill:#f5f7fb}.muted{fill:#aab6cc}.blue{fill:#247bff}.red{fill:#ff354f}
.small{font:600 18px Arial,sans-serif;letter-spacing:2px}
.body{font:400 22px Arial,sans-serif}
.title{font:800 58px Arial,sans-serif;letter-spacing:-1px}
.mono{font:600 18px monospace;letter-spacing:1px}
.fade{animation:fade 1s ease both}
.float{animation:float 5s ease-in-out infinite}
@keyframes fade{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media(prefers-reduced-motion:reduce){.fade,.float{animation:none}}
</style>

<rect width="100%" height="100%" rx="28" class="bg"/>
<rect x="24" y="24" width="calc(100% - 48px)" height="calc(100% - 48px)" rx="24" class="card"/>
<text x="72" y="105" class="small blue">TECH STACK</text>
<text x="72" y="170" class="title white">TOOLS I BUILD WITH</text>
<g fill="none" stroke="#247bff" stroke-opacity=".28" stroke-width="3">
 <ellipse cx="600" cy="390" rx="430" ry="145" transform="rotate(-12 600 390)"/>
 <ellipse cx="600" cy="390" rx="430" ry="145" transform="rotate(22 600 390)"/>
 <ellipse cx="600" cy="390" rx="430" ry="145" transform="rotate(58 600 390)"/>
</g>
<g class="float">
 <circle cx="600" cy="390" r="92" fill="#101d33" stroke="#247bff" stroke-width="2"/>
 <text x="600" y="380" text-anchor="middle" class="small white">AI / FULL</text>
 <text x="600" y="412" text-anchor="middle" class="small red">STACK</text>
</g>
<g class="mono white">
<text x="105" y="285">C</text><text x="170" y="285">C++</text><text x="260" y="285">Java</text>
<text x="105" y="335">JavaScript</text><text x="280" y="335">React.js</text><text x="425" y="335">Node.js</text>
<text x="105" y="620">Express.js</text><text x="270" y="620">MongoDB</text><text x="425" y="620">Socket.IO</text>
<text x="105" y="670">Tailwind CSS</text><text x="300" y="670">Git</text><text x="375" y="670">GitHub</text><text x="480" y="670">Vercel</text>
</g>

</svg>